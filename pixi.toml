[workspace]
name = "hep-constants"
version = "0.1.0"
authors = ["Graeme <graeme@example.com>"]
description = "Parse CODATA ASCII files and generate C++ headers with constexpr constants"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
python = ">=3.14.3,<3.15"
jinja2 = ">=3.1.6,<4"
hepunits = ">=2.4.4,<3"
pytest = ">=9.0.2,<10"
sympy = ">=1.14.0,<2"

[system-requirements]
